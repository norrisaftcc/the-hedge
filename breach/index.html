<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="description" content="Midnight Breach: a line-drawing adventure. Lock an intruder out of the company network before the moves run out.">
<title>Midnight Breach</title>
<!--
  Midnight Breach, a prototype. One file, no build step, nothing installed.

  The page has two halves, and the order matters:
    RULES  the game. No DOM. step(state, line) returns a new state and a list of events.
           Each event carries its text and the data behind it.
    VIEW   the screen. It prints the events' text and draws the picture from the events' data.
           It decides nothing about the game.

  The picture is 280 by 160 dots, drawn with lines only, as on a 1980 home computer.
-->
<style>
  :root {
    --page: #17171b;
    --screen: #000;
    --ink: #f2f2f2;
    --dim: #8f8fa6;
    --green: #14f53c;
    --violet: #ff6bfd;
    --orange: #ff7a45;
    --blue: #3fd4ff;
  }
  * { box-sizing: border-box; }
  html { background: var(--page); }
  body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font: 16px/1.35 ui-monospace, "SF Mono", Menlo, Consolas, "Courier New", monospace;
  }
  main {
    width: min(100% - 32px, 840px, 54vh * 1.75);
    min-width: min(100% - 32px, 320px);
    margin: 16px auto;
  }
  .crt {
    background: var(--screen);
    border: 1px solid #33333d;
    border-radius: 10px;
    padding: 12px;
    text-transform: uppercase;
  }
  canvas {
    display: block;
    width: 100%;
    aspect-ratio: 280 / 160;
    image-rendering: crisp-edges;
    image-rendering: pixelated;
  }
  .status {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    gap: 0 16px;
    margin-top: 8px;
    padding: 4px 0;
    border-block: 1px solid #33333d;
  }
  .status .where { font-weight: 700; }
  .bar .rest { color: var(--dim); }
  .ok { color: var(--green); }
  .warn { color: var(--orange); }
  .crit { color: var(--screen); background: var(--orange); font-weight: 700; }
  .bar .crit { color: var(--orange); background: none; }
  .log {
    height: 10.8em;
    overflow-y: auto;
    margin-top: 6px;
    overflow-wrap: anywhere;
    scrollbar-color: #33333d var(--screen);
  }
  .log p { margin: 0; white-space: pre-wrap; }
  .log .echo { color: var(--dim); margin-top: 0.35em; }
  .log .room { margin-top: 0.35em; }
  .log .room b { background: var(--ink); color: var(--screen); padding: 0 0.5ch; }
  .log .good { color: var(--green); }
  .log .hint { color: var(--violet); }
  .log .cool { color: var(--blue); }
  .prompt { display: flex; gap: 1ch; margin-top: 4px; }
  .prompt input {
    flex: 1;
    min-width: 0;
    background: none;
    border: 0;
    outline: 0;
    padding: 0;
    color: var(--ink);
    font: inherit;
    text-transform: uppercase;
    caret-color: var(--green);
    caret-shape: block;
  }
  .prompt:focus-within span { color: var(--green); }
  footer { color: var(--dim); font-size: 13px; margin-top: 10px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
</style>
</head>
<body>
<main>
  <div class="crt" id="crt">
    <canvas id="pic" width="280" height="160" role="img" aria-label="Title picture"></canvas>
    <div class="status" id="status" aria-live="off">
      <span class="where" id="where">Midnight Breach</span>
      <span id="counts"></span>
      <span class="bar" id="bar"></span>
    </div>
    <div class="log" id="log" role="log" aria-live="polite" tabindex="0" aria-label="The story so far"></div>
    <form class="prompt" id="form" autocomplete="off">
      <span aria-hidden="true">&gt;</span>
      <label class="sr" for="cmd">Your command</label>
      <input id="cmd" name="cmd" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" maxlength="60" enterkeyhint="go">
    </form>
  </div>
  <footer>Midnight Breach. A prototype. Type one or two words and press Enter. HELP lists them.</footer>
</main>

<script>
/* ==RULES== Nothing below touches the page until the VIEW marker. tests/walk.test.mjs runs this half alone. */
const Breach = (() => {
  'use strict';

  const CARRIED = 'carried';
  const GONE = 'gone';

  // Numbers are data. A balance change is a change here.
  const DATA = {
    startMoves: 40,
    start: 'security',
    score: { take: 5, logs: 20, win: 50, perMoveLeft: 2 },
    warn: { low: 12, critical: 5 },                  // moves left
    bar: { width: 20, warn: 40, critical: 75 },      // percent stolen
    ranks: [
      { atLeast: 20, name: 'Elite Analyst' },
      { atLeast: 10, name: 'Senior Analyst' },
      { atLeast: 0, name: 'Junior Analyst' },
    ],
    skate: { item: 'skateboard', every: 2 },
    // North is up.
    grid: [
      ['archive', 'exec', 'conf', 'roof'],
      ['help', 'security', 'server', 'closet'],
      ['garage', 'lobby', 'breakroom', 'vault'],
    ],
    rooms: {
      security: { name: 'Security Office', short: 'SECURITY', desc: 'Monitors flash red: UNAUTHORIZED LOGIN DETECTED.' },
      server: { name: 'Server Room', short: 'SERVER', desc: 'Rows of servers. One terminal is streaming data to an unknown address.' },
      closet: { name: 'Network Closet', short: 'CLOSET', desc: 'A cramped closet of switches and cables. A safe sits open.',
        key: 'badge', locked: 'The closet door is locked. It needs an access badge.' },
      breakroom: { name: 'Break Room', short: 'BREAK', desc: 'A quiet break room. A vending machine hums in the corner.' },
      archive: { name: 'Archive', short: 'ARCHIVE', desc: 'Dusty shelves of old records and unused equipment.' },
      exec: { name: 'Executive Office', short: 'EXEC', desc: "A plush office. The CEO's computer is still logged in." },
      lobby: { name: 'Lobby', short: 'LOBBY', desc: 'A marble lobby. The front desk is empty.' },
      garage: { name: 'Parking Garage', short: 'GARAGE', desc: 'A concrete garage with flickering lights.',
        light: 'flashlight', dark: 'It is pitch dark. You cannot see any items without a light.',
        darkTake: 'It is too dark to find anything.' },
      roof: { name: 'Roof', short: 'ROOF', desc: 'A windy rooftop covered in antennas and satellite dishes.' },
      vault: { name: 'Vault', short: 'VAULT', desc: 'A steel vault. Backup disks sit in numbered slots.',
        key: 'key', locked: 'The vault is locked. It needs a vault key.' },
      conf: { name: 'Conference Room', short: 'CONF', desc: 'A long table with chairs pushed back in a hurry.' },
      help: { name: 'Help Desk', short: 'HELP DESK', desc: 'Headsets and half-finished tickets cover the desks.' },
    },
    items: {
      badge: { name: 'access badge', words: ['badge', 'access'], start: 'archive',
        desc: "A badge marked 'NETWORK CLOSET ACCESS'.",
        use: 'You wave the badge around. It only works on the closet door.' },
      laptop: { name: 'laptop', words: ['laptop', 'computer'], start: 'security',
        desc: 'A security laptop with incident-response tools installed.',
        effect: { kind: 'lockout', room: 'server',
          elsewhere: "The laptop shows 'No secure connection'. Try the Server Room.",
          needs: [
            { item: 'token', text: 'The laptop asks for an admin token.' },
            { item: 'disk', text: 'The laptop asks for the firewall disk.' },
          ],
          text: 'You plug in the token, load the firewall disk, and run the lockout script...' } },
      token: { name: 'admin token', words: ['token', 'admin'], start: 'closet',
        desc: 'A hardware token that holds the admin lockout key.',
        use: 'The token needs a laptop to plug into.' },
      disk: { name: 'firewall disk', words: ['disk', 'firewall'], start: 'vault',
        desc: "A disk labeled 'FIREWALL RULES - RESTORE'.",
        use: 'The disk needs a laptop to load it.' },
      key: { name: 'vault key', words: ['key'], start: 'garage',
        desc: "A heavy steel key stamped 'VAULT'.",
        use: 'You turn the key over. It must fit the vault door.' },
      printout: { name: 'phishing printout', words: ['printout', 'phishing', 'email', 'paper'], start: 'breakroom',
        desc: "A printed email: 'Urgent. Reset your password at this link.'",
        use: "The email came from the CEO's account. The attacker has CEO credentials." },
      usb: { name: 'usb drive', words: ['usb', 'drive'], start: 'exec',
        desc: 'A USB drive that can save the server activity logs.',
        effect: { kind: 'logs', room: 'server',
          text: 'You save the server logs as evidence.',
          elsewhere: 'Nothing to copy here. Try the Server Room.',
          done: 'The logs are already saved.' } },
      flashlight: { name: 'flashlight', words: ['flashlight', 'light', 'torch'], start: 'help',
        desc: 'A heavy flashlight with fresh batteries.',
        use: 'You click on the flashlight. The shadows retreat.' },
      headset: { name: 'headset', words: ['headset', 'headphones'], start: 'help',
        desc: 'A headset. Faint IT chatter plays in the earpiece.',
        use: "IT chatter: 'The firewall disk is locked in the Vault.'" },
      coffee: { name: 'coffee', words: ['coffee', 'cup', 'mug'], start: 'breakroom',
        desc: 'A hot coffee. It might buy you some time.',
        effect: { kind: 'moves', add: 3, text: 'You feel sharper.' } },
      energy: { name: 'energy drink', words: ['energy', 'drink', 'can'], start: 'roof',
        desc: 'A cold energy drink. Big boost, short crash.',
        effect: { kind: 'moves', add: 5, text: 'You pop the can. Zoom.' } },
      skateboard: { name: 'skateboard', words: ['skateboard', 'skate', 'board'], start: 'lobby',
        desc: 'A skateboard. Every other move is free while you carry it.',
        use: 'Just keep it with you. Every other move will be free.' },
      map: { name: 'building map', words: ['map', 'building'], start: 'conf',
        desc: 'A folded map of the whole building.',
        effect: { kind: 'map', text: 'You unfold the map.' } },
      note: { name: 'sticky note', words: ['note', 'sticky'], start: 'conf',
        desc: 'A sticky note in messy handwriting.',
        use: "Note: 'Vault key is in the Parking Garage. Bring a light.'" },
    },
    // The first hint whose items are all still missing is the one given.
    hints: [
      { missing: ['laptop'], text: 'You need the laptop from the Security Office.' },
      { missing: ['token', 'badge'], text: 'Find an access badge in the Archive, the northwest corner.' },
      { missing: ['token'], text: 'The token is in the Network Closet, east of the Server Room.' },
      { missing: ['disk', 'key', 'flashlight'], text: 'The Garage is dark. Get a flashlight from the Help Desk.' },
      { missing: ['disk', 'key'], text: 'The vault key is in the Parking Garage, the southwest corner.' },
      { missing: ['disk'], text: 'The firewall disk is in the Vault, the southeast corner.' },
      { missing: [], text: 'Use the laptop in the Server Room.' },
    ],
    text: {
      help: [
        'Type one or two words and press Enter.',
        'NORTH, EAST, SOUTH, WEST, or N E S W.',
        'LOOK. TAKE LAPTOP. TAKE ALL. USE LAPTOP. EXAMINE BADGE.',
        'INVENTORY. MAP. HINT. SCORE. QUIT. RESTART.',
        'Goal: carry the laptop, the admin token and the firewall disk to the Server Room. Use the laptop there before the moves run out.',
        'Taking items scores points. Moves you save are a bonus.',
      ].join('\n'),
      noWay: 'You cannot go that way.',
      goWhere: 'Go where?',
      notHere: 'You do not see that here.',
      notCarried: 'You are not carrying that.',
      already: 'You already have it.',
      nothing: 'You see nothing to take.',
      empty: 'You carry nothing.',
      drop: 'Keep it. The night is short.',
      unlock: 'A door here opens for whoever carries the right thing. Walk at it.',
      glide: 'You glide on the skateboard. That move was free.',
      low: 'Warning: the intruder is copying more data.',
      critical: 'Critical: the transfer is 95% complete.',
      won: 'System secure. The intruder is locked out.',
      lost: 'Data stolen. The breach is complete.',
      quit: 'You leave the building to its visitor.',
      over: 'The game is over. Type RESTART to play again.',
      again: 'Type RESTART to play again.',
    },
  };

  const DIRS = { north: [-1, 0], east: [0, 1], south: [1, 0], west: [0, -1] };

  // The parser's words. A word from the player is looked up with Object.hasOwn and nothing else.
  const DIR_WORDS = { n: 'north', north: 'north', e: 'east', east: 'east', s: 'south', south: 'south', w: 'west', west: 'west' };
  const VERBS = {
    go: 'go', walk: 'go', move: 'go', run: 'go',
    l: 'look', look: 'look',
    take: 'take', get: 'take', grab: 'take', pick: 'take',
    use: 'use', drink: 'use', read: 'use', ride: 'use', wear: 'use', plug: 'use', load: 'use', play: 'use', unfold: 'use',
    x: 'examine', examine: 'examine', inspect: 'examine', search: 'examine',
    i: 'inventory', inv: 'inventory', inventory: 'inventory',
    map: 'map', help: 'help', hint: 'hint', score: 'score',
    quit: 'quit', exit: 'quit', q: 'quit',
    restart: 'restart', again: 'restart',
    drop: 'drop', unlock: 'unlock', open: 'unlock',
  };
  const FILLER = { the: 1, a: 1, an: 1, at: 1, up: 1, to: 1, on: 1, in: 1, with: 1, my: 1, of: 1 };
  const ALL = { all: 1, everything: 1 };
  const NOUNS = {};
  for (const [id, item] of Object.entries(DATA.items)) for (const w of item.words) NOUNS[w] = id;

  const has = (table, word) => Object.hasOwn(table, word);

  function parse(line) {
    const words = String(line).toLowerCase().replace(/[^a-z0-9 ]/g, ' ').split(' ')
      .filter((w) => w && !has(FILLER, w));
    if (!words.length) return { verb: 'nothing' };
    const [first, ...rest] = words;
    if (has(DIR_WORDS, first)) return { verb: 'go', dir: DIR_WORDS[first] };
    if (!has(VERBS, first)) return { verb: 'unknown', word: first };
    let verb = VERBS[first];
    if (verb === 'go') {
      const d = rest.find((w) => has(DIR_WORDS, w));
      return { verb, dir: d ? DIR_WORDS[d] : null };
    }
    const noun = rest.find((w) => has(NOUNS, w));
    const item = noun ? NOUNS[noun] : null;
    if (verb === 'look' && rest.length) verb = 'examine';
    return { verb, item, all: rest.some((w) => has(ALL, w)), word: rest[0] || null };
  }

  // ---- reading the state ----

  const carried = (s, id) => s.where[id] === CARRIED;

  function exitsOf(roomId) {
    const out = {};
    DATA.grid.forEach((row, r) => row.forEach((id, c) => {
      if (id !== roomId) return;
      for (const [dir, [dr, dc]] of Object.entries(DIRS)) {
        const to = DATA.grid[r + dr]?.[c + dc];
        if (to) out[dir] = to;
      }
    }));
    return out;
  }

  const locked = (s, roomId) => {
    const need = DATA.rooms[roomId].key;
    return Boolean(need) && !carried(s, need);
  };

  const dark = (s, roomId) => {
    const need = DATA.rooms[roomId].light;
    return Boolean(need) && !carried(s, need);
  };

  const visible = (s) => (dark(s, s.at) ? [] : Object.keys(DATA.items).filter((id) => s.where[id] === s.at));

  const list = (ids) => ids.map((id) => DATA.items[id].name).join(', ');

  // ---- events ----

  function roomEvent(s, how) {
    const room = DATA.rooms[s.at];
    const here = visible(s);
    const lines = [room.desc];
    if (dark(s, s.at)) lines.push(room.dark);
    else lines.push(here.length ? `You see: ${list(here)}.` : DATA.text.nothing);
    lines.push(`Exits: ${Object.keys(exitsOf(s.at)).join(', ')}.`);
    return { type: 'room', how, room: s.at, name: room.name, items: here, text: lines.join('\n') };
  }

  function mapEvent(s, text) {
    const cells = {};
    const lines = [text, `North is up. You are in the ${DATA.rooms[s.at].name}.`];
    for (const [id, room] of Object.entries(DATA.rooms)) {
      cells[id] = { short: room.short, locked: locked(s, id) };
      if (cells[id].locked) lines.push(`Locked: ${room.name}. It needs the ${DATA.items[room.key].name}.`);
    }
    return { type: 'map', grid: DATA.grid, at: s.at, cells, text: lines.join('\n') };
  }

  // The last event of every step. The view draws its frame from this and nothing else.
  function statusEvent(s) {
    const { width, warn, critical } = DATA.bar;
    const filled = Math.max(0, Math.min(width, Math.trunc((DATA.startMoves - s.moves) * width / DATA.startMoves)));
    const percent = filled * 100 / width;
    const exits = {};
    for (const [dir, to] of Object.entries(exitsOf(s.at))) exits[dir] = { to, locked: locked(s, to) };
    return {
      type: 'status', room: s.at, name: DATA.rooms[s.at].name, dark: dark(s, s.at),
      items: visible(s), exits, moves: s.moves, score: s.score, over: s.over,
      stolen: { filled, width, percent, level: percent >= critical ? 'crit' : percent >= warn ? 'warn' : 'ok' },
    };
  }

  // ---- the game ----

  function newGame() {
    const where = {};
    for (const [id, item] of Object.entries(DATA.items)) where[id] = item.start;
    const state = { at: DATA.start, moves: DATA.startMoves, steps: 0, score: 0, logs: false, over: null, where };
    return { state, events: [roomEvent(state, 'entered'), statusEvent(state)] };
  }

  function step(prev, line) {
    const cmd = parse(line);
    if (cmd.verb === 'restart') return newGame();
    const s = structuredClone(prev);
    const events = [];
    const say = (text, type = 'say', data = {}) => events.push({ type, text, ...data });
    const T = DATA.text;

    const finish = () => { say(`Final score: ${s.score}.`); say(T.again); };

    const go = () => {
      if (!cmd.dir) return say(T.goWhere);
      const to = exitsOf(s.at)[cmd.dir];
      if (!to) return say(T.noWay, 'blocked');
      if (locked(s, to)) return say(DATA.rooms[to].locked, 'blocked', { room: to });
      s.at = to;
      s.steps += 1;
      const free = carried(s, DATA.skate.item) && s.steps % DATA.skate.every === 0;
      if (!free) s.moves -= 1;
      if (s.moves <= 0) {
        s.over = 'lost';
        say(T.lost, 'lose');
        return finish();
      }
      if (free) say(T.glide, 'free');
      events.push(roomEvent(s, 'entered'));
      if (s.moves <= DATA.warn.critical) say(T.critical, 'crit');
      else if (s.moves <= DATA.warn.low) say(T.low, 'warn');
    };

    const takeOne = (id) => {
      s.where[id] = CARRIED;
      s.score += DATA.score.take;
    };

    const take = () => {
      if (dark(s, s.at)) return say(DATA.rooms[s.at].darkTake, 'blocked');
      if (cmd.all) {
        const here = visible(s);
        if (!here.length) return say(T.nothing);
        here.forEach(takeOne);
        return say(`Taken: ${list(here)}.`, 'taken', { items: here });
      }
      if (!cmd.item) return say(cmd.word ? T.notHere : 'Take what?');
      if (carried(s, cmd.item)) return say(T.already);
      if (s.where[cmd.item] !== s.at) return say(T.notHere);
      takeOne(cmd.item);
      say(`Taken: ${DATA.items[cmd.item].name}.`, 'taken', { items: [cmd.item], item: cmd.item });
    };

    const use = () => {
      if (!cmd.item) return say(cmd.word ? T.notCarried : 'Use what?');
      if (!carried(s, cmd.item)) return say(T.notCarried);
      const item = DATA.items[cmd.item];
      const fx = item.effect;
      if (!fx) return say(item.use, 'used', { item: cmd.item });
      if (fx.kind === 'map') return events.push(mapEvent(s, fx.text));
      if (fx.kind === 'moves') {
        s.where[cmd.item] = GONE;
        s.moves += fx.add;
        return say(`${fx.text} +${fx.add} moves.`, 'good', { item: cmd.item, moves: fx.add });
      }
      if (fx.kind === 'logs') {
        if (s.at !== fx.room) return say(fx.elsewhere);
        if (s.logs) return say(fx.done);
        s.logs = true;
        s.score += DATA.score.logs;
        return say(`${fx.text} +${DATA.score.logs} points.`, 'good', { item: cmd.item, points: DATA.score.logs });
      }
      if (fx.kind === 'lockout') {
        if (s.at !== fx.room) return say(fx.elsewhere);
        const lack = fx.needs.find((n) => !carried(s, n.item));
        if (lack) return say(lack.text);
        const bonus = s.moves * DATA.score.perMoveLeft;
        s.score += DATA.score.win + bonus;
        s.over = 'won';
        const rank = DATA.ranks.find((r) => s.moves >= r.atLeast).name;
        say(fx.text);
        say(T.won, 'win', { movesLeft: s.moves, bonus, rank, score: s.score });
        say(`Moves left: ${s.moves}. Bonus: +${bonus}.`);
        say(`Rank: ${rank}.`, 'good');
        return finish();
      }
    };

    const examine = () => {
      if (!cmd.item) return say(cmd.word ? T.notHere : 'Examine what?');
      if (!carried(s, cmd.item) && !visible(s).includes(cmd.item)) return say(T.notHere);
      const item = DATA.items[cmd.item];
      say(`${item.name}: ${item.desc}`, 'examine', { item: cmd.item, name: item.name });
    };

    const inventory = () => {
      const ids = Object.keys(DATA.items).filter((id) => carried(s, id));
      say(ids.length ? `You carry: ${list(ids)}.` : T.empty, 'inventory', { items: ids });
    };

    const hint = () => {
      const h = DATA.hints.find((x) => x.missing.every((id) => !carried(s, id)));
      say(`Hint: ${h.text}`, 'hint');
    };

    const verbs = {
      nothing: () => {},
      unknown: () => say(`I do not know the word "${cmd.word}". Try HELP.`),
      go, take, use, examine, inventory, hint,
      look: () => events.push(roomEvent(s, 'looked')),
      map: () => events.push(mapEvent(s, 'The building.')),
      help: () => say(T.help, 'help'),
      score: () => say(`Moves left: ${s.moves}. Score: ${s.score}.`),
      drop: () => say(T.drop),
      unlock: () => say(T.unlock),
      quit: () => { s.over = 'quit'; say(T.quit, 'quit'); finish(); },
    };

    if (s.over) say(T.over);
    else verbs[cmd.verb]();

    events.push(statusEvent(s));
    return { state: s, events };
  }

  return { DATA, newGame, step, parse };
})();
/* ==VIEW== */

(() => {
  'use strict';

  // ---- the plotter: 280 by 160 dots, lines only ----

  const W = 280, H = 160;
  const BLACK = 0, WHITE = 1, GREEN = 2, VIOLET = 3, ORANGE = 4, BLUE = 5, DIM = 6;
  const PALETTE = [[0, 0, 0], [242, 242, 242], [20, 245, 60], [255, 107, 253], [255, 122, 69], [63, 212, 255], [84, 84, 132]];

  const canvas = document.getElementById('pic');
  const ctx = canvas.getContext('2d');
  const image = ctx.createImageData(W, H);
  const dots = new Uint32Array(image.data.buffer);
  const INK = PALETTE.map(([r, g, b]) => ((255 << 24) | (b << 16) | (g << 8) | r) >>> 0);

  function line([x0, y0, x1, y1, c]) {
    x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
    const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0);

      else if (cell.locked) segs.push(...TC(col, x + BW / 2, y + 16, 'LOCKED'));
      if (c < row.length - 1) segs.push(...P(WHITE, x + BW, y + BH / 2, x + 66, y + BH / 2));
      if (r < e.grid.length - 1) segs.push(...P(WHITE, x + BW / 2, y + BH, x + BW / 2, y + 42));
    }));
    segs.push(...P(WHITE, 140, 150, 140, 142), ...P(WHITE, 137, 145, 140, 142, 143, 145), ...T(WHITE, 146, 144, 'NORTH'));
    return segs;
  }

  const windows = () => {
    const out = [];
    for (let r = 0; r < 3; r += 1) for (let c = 0; c < 8; c += 1) {
      const lit = r === 1 && c === 5;
      const x = 68 + c * 19, y = 98 + r * 17;
      out.push(...R(lit ? GREEN : WHITE, x, y, 10, 9));
      if (lit) out.push(...P(GREEN, x + 5, y, x + 5, y + 9), ...P(GREEN, x, y + 4, x + 10, y + 4));
    }
    return out;
  };

  const PICTURES = {
    title: [
      ...TC(WHITE, 140, 18, 'MIDNIGHT', 4), ...TC(ORANGE, 140, 48, 'BREACH', 4),
      ...P(WHITE, 0, 150, 279, 150), ...P(WHITE, 60, 150, 60, 90, 220, 90, 220, 150),
      ...windows(), ...C(WHITE, 248, 24, 10, 14),
      ...T(BLUE, 62, 80, '01001101 01001001 01000100'), ...T(WHITE, 186, 80, '12:00 AM'),
    ],
    won: [
      ...P(GREEN, 140, 22, 184, 36, 184, 76, 140, 114, 96, 76, 96, 36, 140, 22),
      ...P(GREEN, 118, 66, 134, 84, 164, 48),
      ...TC(GREEN, 140, 124, 'SYSTEM SECURE', 2), ...TC(WHITE, 140, 144, 'INTRUDER LOCKED OUT'),
    ],
    lost: [
      ...TC(ORANGE, 140, 14, 'DATA STOLEN', 2),
      ...R(ORANGE, 60, 34, 160, 14),
      ...Array.from({ length: 52 }, (_, i) => P(ORANGE, 63 + i * 3, 37, 63 + i * 3, 45)).flat(),
      ...TC(ORANGE, 140, 54, '100%'),
      ...C(WHITE, 140, 96, 20, 16), ...R(WHITE, 130, 114, 20, 10),
      ...P(WHITE, 135, 114, 135, 124), ...P(WHITE, 140, 114, 140, 124), ...P(WHITE, 145, 114, 145, 124),
      ...P(WHITE, 129, 90, 136, 97), ...P(WHITE, 136, 90, 129, 97), ...P(WHITE, 144, 90, 151, 97), ...P(WHITE, 151, 90, 144, 97),
      ...P(WHITE, 140, 100, 138, 105, 142, 105, 140, 100),
      ...TC(WHITE, 140, 144, 'THE BREACH IS COMPLETE'),
    ],
  };

  // ---- the page ----

  const $ = (id) => document.getElementById(id);
  const log = $('log'), input = $('cmd');
  const KIND = { blocked: 'warn', warn: 'warn', crit: 'crit', lose: 'crit', taken: 'good', good: 'good', win: 'good', free: 'cool', hint: 'hint', echo: 'echo' };

  function print(text, type) {
    for (const row of String(text).split('\n')) {
      const p = document.createElement('p');
      if (Object.hasOwn(KIND, type)) p.className = KIND[type];
      p.textContent = row;
      log.append(p);
    }
  }

  function printRoom(e) {
    const p = document.createElement('p');
    p.className = 'room';
    const b = document.createElement('b');
    b.textContent = e.name;
    p.append(b);
    log.append(p);
    print(e.text);
  }

  function showStatus(st) {
    $('where').textContent = st.name;
    $('counts').textContent = `Moves ${st.moves}  Score ${st.score}`;
    const bar = $('bar');
    const fill = document.createElement('span'), rest = document.createElement('span'), pct = document.createElement('span');
    fill.className = pct.className = st.stolen.level;
    rest.className = 'rest';
    fill.textContent = '#'.repeat(st.stolen.filled);
    rest.textContent = '-'.repeat(st.stolen.width - st.stolen.filled);
    pct.textContent = `${st.stolen.percent}%`;
    bar.replaceChildren('Stolen [', fill, rest, '] ', pct);
  }

  let state = null;
  let shown = null;        // the room whose picture is on the screen, or null for any other picture

  // Print the events, then draw the one picture they call for.
  function show(events) {
    let picture = null, slowly = false, label = '';
    let status = null;
    for (const e of events) {
      if (e.type === 'room') {
        printRoom(e);
        slowly = true;
      } else if (e.type === 'status') {
        status = e;
      } else if (e.text) {
        print(e.text, e.type);
      }
      if (e.type === 'map') { picture = mapPicture(e); label = 'Map of the building'; }
      if ((e.type === 'examine' || e.type === 'taken') && e.item) {
        const name = Breach.DATA.items[e.item].name;
        picture = itemPicture(e.item, name);
        label = `Close view: ${name}`;
      }
    }
    showStatus(status);
    if (status.over === 'won' || status.over === 'lost') {
      picture = PICTURES[status.over];
      label = status.over === 'won' ? 'A shield with a tick' : 'A skull under a full progress bar';
      slowly = events.some((e) => e.type === 'win' || e.type === 'lose');
    }
    if (picture) {
      shown = null;
    } else {
      picture = roomPicture(status);
      label = `Line drawing: ${status.name}`;
      slowly = slowly || shown !== status.room;
      shown = status.room;
    }
    canvas.setAttribute('aria-label', label);
    paint(picture, slowly);
    while (log.childElementCount > 300) log.firstElementChild.remove();
    log.scrollTop = log.scrollHeight;
  }

  function begin() {
    const game = Breach.newGame();
    state = game.state;
    shown = null;
    log.replaceChildren();
    show(game.events);
  }

  function title() {
    paint(PICTURES.title, true);
    print('An intruder is stealing company data.');
    print('Carry the laptop, the admin token and the firewall disk to the Server Room. Lock the intruder out before the moves run out.');
    print('Press Enter to begin.', 'good');
  }

  const past = [];
  let recall = 0;

  $('form').addEventListener('submit', (ev) => {
    ev.preventDefault();
    const text = input.value.trim();
    input.value = '';
    if (!state) return begin();
    if (!text) return;
    past.push(text);
    recall = past.length;
    print(`> ${text}`, 'echo');
    const restart = Breach.parse(text).verb === 'restart';
    const result = Breach.step(state, text);
    state = result.state;
    if (restart) { shown = null; log.replaceChildren(); }
    show(result.events);
  });

  input.addEventListener('keydown', (ev) => {
    if (ev.key !== 'ArrowUp' && ev.key !== 'ArrowDown') return;
    ev.preventDefault();
    recall = Math.max(0, Math.min(past.length, recall + (ev.key === 'ArrowUp' ? -1 : 1)));
    input.value = recall < past.length ? past[recall] : '';
  });

  // A click anywhere on the screen goes to the command line, unless you are selecting text to copy.
  $('crt').addEventListener('click', () => {
    if (!getSelection().toString()) input.focus();
  });

  title();
  input.focus();
})();
</script>
</body>
</html>
